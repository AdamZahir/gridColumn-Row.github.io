<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid template column-rows</title>

    <style>


.grid-container{
    width: 100%;
    height: 700px;
    background-color: rgb(243, 243, 243);

    gap: 10px 20px;
    /*MODULO GRID*/

    display: grid;
    grid-template-areas: 
    "header header header"
    "nav    nav     nav"
    "contenido1 contenido1 aside "
           "contenido1 contenido1 aside "
    "contenido2 contenido3 aside "
        "contenido2 contenido3 aside "
    "footer footer footer "
    ;

}


.item1{
grid-area: header;
background-color: #205b21;

}

.item2{
grid-area: nav;
background-color :#ff9fc2 ;
}
.item3{
grid-area: contenido1;
background-color: #64a94f;
}
.item4{
grid-area: contenido2;
background-color: #a9fc9c;
}


.item5{
grid-area: contenido3;
background-color:  #addead;
}


.item6{
grid-area: aside;
background-color: #f62776;
}


.item7{
grid-area: footer;
background-color: #393a3c;
}

 


@media screen and (max-width: 720px){
        .grid-container{

        display: grid;
        grid-template-areas: 
        "header"
        "nav"
        "contenido1"
            "contenido2"
            "contenido3"
        "aside"
        "footer"
        ;
            grid-template-rows: 1fr .5fr 2fr 1fr 1fr 2fr 1fr;
    }

    } 



   
    </style>
</head>


<body>
    
    <section class="grid-container">
        <div class="grid-item item1">header</div>
        <div class="grid-item item2">nav</div>
        <div class="grid-item item3">contenido 1 </div>
        <div class="grid-item item4">contenido 2 </div>
        <div class="grid-item item5">contenido 3 </div>
        <div class="grid-item item6">aside</div>
        <div class="grid-item item7">footer</div>


        
    </section>


</body>
</html>
